[project]
name = "quantdash"
version = "0.1.0"
description = "Alpaca-powered trading bot / research toolkit"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.40.0",
    "python-dotenv>=1.1",
    "pandas>=2.3",
    "numpy>=2.3",
    "pyarrow>=20.0",
    "click>=8.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]

[project.scripts]             # this wires up CLI entry points
qdash-download = "src.download:cli"
qdash-backtest = "src.backtest:cli"
qdash-paper    = "src.paper:cli"

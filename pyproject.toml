[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdash"
version = "0.1.0"
description = "QuantDash: a simple quant toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name="Your Name", email="you@example.com" }
]
dependencies = [
  "alpaca-py>=0.40.0",
  "python-dotenv>=1.1",
  "pandas>=2.3",
  "numpy>=2.3",
  "pyarrow>=20.0",
  "click>=8.2"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "ruff"
]

[project.scripts]
qdash = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

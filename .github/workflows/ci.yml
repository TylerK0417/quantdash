name: CI

on:
  push:
    branches: [main, feat/*, fix/*, chore/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # 1 — Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 — Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3 — Install project (+ dev extras)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 4 — Lint
      - name: Ruff (lint)
        run: ruff check .

      - name: Black (check only)
        run: black --check .

      # 5 — Run tests & coverage
      - name: Run tests & coverage
        run: |
          pytest -q --cov=src --cov-report=xml
          coverage report --fail-under=75
